<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Book Scanner</title>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
    :root {
      --orange: #f57c00;
      --blue: #1565c0;
      --green: #4caf50;
      --dark: #1a1a1a;
      --mid: #2b2b2b;
      --light: #3a3a3a;
      --text: #ffffff;
      --muted: #888888;
      --radius: 12px;
    }
    body { font-family: Arial, sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; }

    /* ── VIEWS ── */
    .view { display: none; flex-direction: column; align-items: center; padding: 16px; min-height: 100vh; }
    .view.active { display: flex; }

    /* ── SCANNER VIEW ── */
    #scanner-view h1 { font-size: 1.2rem; padding-bottom: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--orange); }
    #scan-btn-area { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--mid); border-radius: var(--radius); border: 3px solid var(--blue); padding: 40px 20px; gap: 12px; }
    #scan-btn { width: 100px; height: 100px; border-radius: 50%; border: none; background: var(--blue); color: #fff; font-size: 2.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(21,101,192,0.5); }
    #scan-btn:active { transform: scale(0.95); }
    #scan-btn-label { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); }
    #cache-status { font-size: 0.7rem; color: #444; margin-top: 4px; letter-spacing: 1px; }
    #scanner-container { width: 100%; max-width: 480px; position: relative; background: #000; border-radius: var(--radius); overflow: hidden; border: 3px solid var(--blue); max-height: 340px; display: none; }
    #scanner-container video { width: 100%; height: 340px; object-fit: cover; display: block; }
    #scanner-container canvas.drawingBuffer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #target { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 75%; height: 35%; pointer-events: none; }
    #target::before, #target::after, #target .corner-br, #target .corner-bl { content: ''; position: absolute; width: 24px; height: 24px; border-color: var(--green); border-style: solid; }
    #target::before { top: 0; left: 0; border-width: 3px 0 0 3px; }
    #target::after  { top: 0; right: 0; border-width: 3px 3px 0 0; }
    #target .corner-br { bottom: 0; right: 0; border-width: 0 3px 3px 0; }
    #target .corner-bl { bottom: 0; left: 0; border-width: 0 0 3px 3px; }
    #target .barcode-hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 70%; opacity: 0.12; }
    #stop-btn { width: 100%; max-width: 480px; margin-top: 12px; padding: 14px; border: none; border-radius: var(--radius); background: var(--light); color: var(--muted); font-size: 0.9rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; display: none; }
    #result-area { width: 100%; max-width: 480px; margin-top: 16px; background: var(--mid); border-radius: var(--radius); padding: 16px 20px; text-align: center; cursor: pointer; }
    #result-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 6px; }
    #result-code { font-size: 1.4rem; font-weight: 700; color: var(--green); letter-spacing: 2px; min-height: 1.8rem; }
    #result-hint { font-size: 0.8rem; color: #555; margin-top: 6px; }
    #inventory-btn { width: 100%; max-width: 480px; margin-top: 16px; padding: 16px; border: none; border-radius: var(--radius); background: var(--orange); color: #fff; font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
    #inventory-btn:active { opacity: 0.8; }

    /* ── INVENTORY VIEW ── */
    #inventory-view { background: var(--dark); width: 100%; }
    #inv-header { width: 100%; background: var(--mid); padding: 16px; display: flex; align-items: center; gap: 12px; border-bottom: 3px solid var(--orange); position: sticky; top: 0; z-index: 10; }
    #inv-back { background: none; border: none; color: var(--orange); font-size: 1.4rem; cursor: pointer; padding: 4px; flex-shrink: 0; }
    #inv-header h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; color: var(--orange); flex: 1; }
    #inv-count { font-size: 0.75rem; color: var(--muted); flex-shrink: 0; }
    #inv-search-wrap { width: 100%; padding: 12px 16px; background: var(--dark); position: sticky; top: 65px; z-index: 9; }
    #inv-search { width: 100%; padding: 11px 14px; font-size: 1rem; border: 2px solid #444; border-radius: var(--radius); background: var(--mid); color: var(--text); }
    #inv-search:focus { outline: none; border-color: var(--blue); }
    #sort-bar { display: flex; gap: 8px; margin-top: 8px; }
    .sort-btn { flex: 1; padding: 8px; border: none; border-radius: 8px; background: var(--light); color: var(--muted); font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
    .sort-btn.active { background: var(--blue); color: #fff; }
    #inv-list { width: 100%; padding: 0 16px 80px; }
    .inv-row { background: var(--mid); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; cursor: pointer; border-left: 4px solid transparent; }
    .inv-row:active { opacity: 0.8; }
    .inv-row.is-master { border-left-color: var(--orange); }
    .inv-row-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .inv-title { font-size: 1rem; font-weight: 700; flex: 1; }
    .inv-qty { font-size: 1.1rem; font-weight: 700; color: var(--green); flex-shrink: 0; }
    .inv-qty.low { color: var(--orange); }
    .inv-qty.zero { color: #c62828; }
    .inv-meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; }
    .inv-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .inv-tag { font-size: 0.72rem; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
    .inv-tag.master-badge { background: #3a2800; color: var(--orange); border: 1px solid var(--orange); }
    .inv-tag.master-link { background: #1a3a5c; color: #90caf9; border: 1px solid var(--blue); cursor: pointer; }
    .inv-tag.master-link:active { background: var(--blue); color: #fff; }
    .inv-tag.not-stocked { background: #3a1a1a; color: #e08a8a; border: 1px solid #7a3a3a; }
    .inv-empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 0.9rem; }
    #inv-loading { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 0.9rem; }

    /* ── MODAL ── */
    #modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: flex-end; justify-content: center; }
    #modal-overlay.show { display: flex; }
    #modal { background: var(--mid); border-radius: 20px 20px 0 0; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; padding: 16px 20px 24px; }
    #modal-title { font-size: 1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--orange); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    #modal-badge { font-size: 0.7rem; padding: 3px 10px; border-radius: 20px; font-weight: 700; }
    #modal-badge.new { background: #1565c0; color: #fff; }
    #modal-badge.existing { background: #6a1b9a; color: #fff; }
    .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .form-group label { display: none; }
    label.toggle { display: block; }
    .form-group input[type="text"], .form-group input[type="number"], .form-group select { padding: 9px 12px; font-size: 1rem; border: 2px solid #444; border-radius: 8px; background: var(--light); color: var(--text); }
    .form-group input[type="text"]::placeholder,
    .form-group input[type="number"]::placeholder { color: var(--muted); opacity: 1; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--blue); }
    .form-group input[readonly] { background: #222; color: var(--muted); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .qty-row { display: flex; align-items: center; gap: 10px; }
    .qty-btn { width: 42px; height: 42px; border: none; border-radius: 8px; background: var(--light); color: var(--text); font-size: 1.4rem; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; touch-action: manipulation; user-select: none; -webkit-user-select: none; }    .qty-btn:active { background: #555; }
    .qty-row input { flex: 1; padding: 9px 12px; font-size: 1rem; border: 2px solid #444; border-radius: 8px; background: var(--light); color: var(--text); text-align: center; }
    .qty-row input:focus { outline: none; border-color: var(--blue); }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; background: var(--light); border-radius: 8px; padding: 10px 12px; }
    .toggle-label { font-size: 0.95rem; }
    .toggle { position: relative; width: 48px; height: 26px; flex-shrink: 0; }
    .toggle input { display: none; }
    .toggle-track { position: absolute; inset: 0; background: #444; border-radius: 13px; cursor: pointer; transition: background 0.2s; }
    .toggle input:checked + .toggle-track { background: var(--green); }
    .toggle-track::after { content: ''; position: absolute; width: 20px; height: 20px; background: #fff; border-radius: 50%; top: 3px; left: 3px; transition: left 0.2s; }
    .toggle input:checked + .toggle-track::after { left: 25px; }
    #masters-section { display: block; }
    #masters-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .master-tag { display: inline-flex; align-items: center; gap: 6px; background: #1a3a5c; border: 1px solid var(--blue); color: #90caf9; border-radius: 20px; padding: 5px 12px; font-size: 0.82rem; font-weight: 600; cursor: pointer; user-select: none; }
    .master-tag.selected { background: var(--blue); color: #fff; }
    .no-masters { font-size: 0.82rem; color: var(--muted); font-style: italic; }
    .modal-actions { display: flex; gap: 12px; margin-top: 14px; }
    .btn { flex: 1; padding: 14px; font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; border: none; border-radius: 10px; cursor: pointer; }
    .btn:active { opacity: 0.8; }
    .btn-save { background: var(--green); color: #fff; }
    .btn-cancel { background: var(--light); color: var(--muted); }

    /* ── TOAST ── */
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #222; color: #fff; padding: 12px 24px; border-radius: 30px; font-weight: 600; font-size: 0.9rem; z-index: 999; transition: transform 0.3s ease; white-space: nowrap; }
    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.success { background: var(--green); }
    #toast.error { background: #c62828; }

    /* ── PULL TO REFRESH ── */
    /* Standalone home-screen mode (apple-mobile-web-app-capable) has no
       Safari chrome, so iOS's native pull-to-refresh isn't available --
       this replaces it so a database update elsewhere can be picked up
       without closing and reopening the app. */
    #pull-refresh { position: fixed; top: 0; left: 0; right: 0; height: 60px; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--dark); color: var(--muted); font-size: 0.85rem; font-weight: 600; transform: translateY(-60px); transition: transform 0.25s ease; z-index: 1000; pointer-events: none; }
    #pull-refresh.dragging { transition: none; }
    #pull-refresh .pr-icon { font-size: 1.1rem; display: inline-block; }
    #pull-refresh .pr-icon.spin { animation: pr-spin 0.7s linear infinite; }
    @keyframes pr-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="pull-refresh"><span class="pr-icon" id="pr-icon">↓</span><span id="pr-text">Pull to refresh</span></div>

  <!-- ══ SCANNER VIEW ══ -->
  <div id="scanner-view" class="view active">
    <h1>📚 Book Scanner</h1>

    <div id="scan-btn-area">
      <button id="scan-btn" onclick="startScanner()">📷</button>
      <div id="scan-btn-label">Tap to Scan</div>
      <div id="cache-status">Loading inventory...</div>
    </div>

    <div id="scanner-container">
      <video id="video" autoplay playsinline muted></video>
      <div id="target">
        <div class="corner-br"></div>
        <div class="corner-bl"></div>
        <svg class="barcode-hint" viewBox="0 0 220 80" xmlns="http://www.w3.org/2000/svg" fill="white">
          <rect x="0"  y="0" width="3"  height="80"/><rect x="5"  y="0" width="1"  height="80"/>
          <rect x="8"  y="0" width="4"  height="80"/><rect x="14" y="0" width="2"  height="80"/>
          <rect x="18" y="0" width="3"  height="80"/><rect x="23" y="0" width="1"  height="80"/>
          <rect x="26" y="0" width="5"  height="80"/><rect x="33" y="0" width="2"  height="80"/>
          <rect x="37" y="0" width="3"  height="80"/><rect x="42" y="0" width="1"  height="80"/>
          <rect x="45" y="0" width="4"  height="80"/><rect x="51" y="0" width="2"  height="80"/>
          <rect x="55" y="0" width="3"  height="80"/><rect x="60" y="0" width="1"  height="80"/>
          <rect x="63" y="0" width="5"  height="80"/><rect x="70" y="0" width="2"  height="80"/>
          <rect x="74" y="0" width="3"  height="80"/><rect x="79" y="0" width="1"  height="80"/>
          <rect x="82" y="0" width="4"  height="80"/><rect x="88" y="0" width="2"  height="80"/>
          <rect x="92" y="0" width="3"  height="80"/><rect x="97" y="0" width="1"  height="80"/>
          <rect x="100" y="0" width="5" height="80"/><rect x="107" y="0" width="2" height="80"/>
          <rect x="111" y="0" width="3" height="80"/><rect x="116" y="0" width="1" height="80"/>
          <rect x="119" y="0" width="4" height="80"/><rect x="125" y="0" width="2" height="80"/>
          <rect x="129" y="0" width="3" height="80"/><rect x="134" y="0" width="1" height="80"/>
          <rect x="137" y="0" width="5" height="80"/><rect x="144" y="0" width="2" height="80"/>
          <rect x="148" y="0" width="3" height="80"/><rect x="153" y="0" width="1" height="80"/>
          <rect x="156" y="0" width="4" height="80"/><rect x="162" y="0" width="2" height="80"/>
          <rect x="166" y="0" width="3" height="80"/><rect x="171" y="0" width="1" height="80"/>
          <rect x="174" y="0" width="5" height="80"/><rect x="181" y="0" width="2" height="80"/>
          <rect x="185" y="0" width="3" height="80"/><rect x="190" y="0" width="1" height="80"/>
          <rect x="193" y="0" width="4" height="80"/><rect x="199" y="0" width="2" height="80"/>
          <rect x="203" y="0" width="3" height="80"/><rect x="208" y="0" width="1" height="80"/>
          <rect x="211" y="0" width="5" height="80"/><rect x="218" y="0" width="2" height="80"/>
        </svg>
      </div>
    </div>

    <button id="stop-btn" onclick="stopScanner()">✕ Stop Scanning</button>
    <button id="flip-btn" onclick="flipCamera()" style="display:none;">🔄 Flip Camera</button>

    <div id="result-area" onclick="openLastScanned()">
      <div id="result-label">Last Scanned</div>
      <div id="result-code">—</div>
      <div id="result-hint">Tap the button above to start scanning</div>
    </div>

    <div id="manual-entry" style="width:100%;max-width:480px;margin-top:16px;display:flex;gap:10px;">
      <input type="number" id="manual-isbn" inputmode="numeric" placeholder="Enter ISBN manually..."
        style="flex:1;padding:14px;font-size:1rem;border:2px solid #444;border-radius:var(--radius);background:var(--mid);color:var(--text);"
        onkeydown="if(event.key==='Enter')submitManualISBN()"/>
      <button onclick="submitManualISBN()"
        style="padding:14px 18px;border:none;border-radius:var(--radius);background:var(--blue);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;">Go</button>
    </div>
    <button id="inventory-btn" onclick="showInventory()">📊 View Inventory</button>
  </div>

  <!-- ══ INVENTORY VIEW ══ -->
  <div id="inventory-view" class="view">
    <div id="inv-header">
      <button id="inv-back" onclick="showScanner()">‹</button>
      <h2>📚 Inventory</h2>
      <span id="inv-count"></span>
    </div>
    <div id="inv-search-wrap">
      <input type="text" id="inv-search" placeholder="🔍 Search title, ISBN, shelf..." oninput="filterInventory()"/>
      <div id="sort-bar">
        <button class="sort-btn active" onclick="sortInventory('title')">Title</button>
        <button class="sort-btn" onclick="sortInventory('isbn')">ISBN</button>
        <button class="sort-btn" onclick="sortInventory('shelf')">Shelf</button>
        <button class="sort-btn" onclick="sortInventory('qty')">Qty</button>
      </div>
    </div>
    <div id="inv-list">
      <div id="inv-loading">Loading inventory...</div>
    </div>
  </div>

  <!-- ══ MODAL ══ -->
  <div id="modal-overlay">
    <div id="modal">
      <div id="modal-title">
        <span>📖 Book Details</span>
        <span id="modal-badge" class="new">NEW</span>
      </div>
      <div class="form-group">
        <label>ISBN / Barcode</label>
        <input type="text" id="f-isbn" readonly placeholder="ISBN / Barcode"/>
      </div>
      <div class="form-group">
        <label>SKU</label>
        <input type="text" id="f-sku" placeholder="SKU"/>
      </div>
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="f-title" placeholder="Title"/>
      </div>
      <div class="form-group">
        <label>Quantity on Hand</label>
        <input type="number" id="f-qty" value="0" min="0" placeholder="Qty" oninput="onQtyDirectChange()"/>
      </div>
      <div class="form-group">
        <label>Loose Count</label>
        <div class="qty-row">
          <button class="qty-btn" onclick="adjustLoose(-1)">−</button>
          <input type="number" id="f-loose" value="" min="0" inputmode="numeric" placeholder="Loose Count" oninput="onLooseChange()"/>
          <button class="qty-btn" onclick="adjustLoose(1)">+</button>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Boxes</label>
          <input type="number" id="f-boxes" value="" min="0" inputmode="numeric" placeholder="Boxes" oninput="onBoxFieldChange()"/>
        </div>
        <div class="form-group">
          <label>Box Count</label>
          <input type="number" id="f-boxcount" value="" min="0" inputmode="numeric" placeholder="Box Count" oninput="onBoxFieldChange()"/>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Bookcase</label>
          <select id="f-bookcase">
            <option value="">— Bookcase —</option>
            <option value="*Clearance">*Clearance</option>
            <option value="Corwin">Corwin</option>
            <option value="Corwin2">Corwin2</option>
            <option value="Heinemann">Heinemann</option>
            <option value="SolutionTree">SolutionTree</option>
            <option value="Bernabei">Bernabei</option>
            <option value="JWJB">JWJB</option>
            <option value="Scholastic">Scholastic</option>
            <option value="Stenhouse">Stenhouse</option>
            <option value="Misc">Misc</option>
            <option value="Kids">Kids</option>
            <option value="PrepTable">PrepTable</option>
            <option value="PackagingShelf">PackagingShelf</option>
            <option value="Lowboy">Lowboy</option>
          </select>
        </div>
        <div class="form-group">
          <label>Shelf</label>
          <input type="text" id="f-shelf" placeholder="Shelf" inputmode="numeric" pattern="[0-9]*"/>
        </div>
      </div>
      <div class="form-group">
        <label>Master Item</label>
        <div class="toggle-row">
          <span class="toggle-label">This book is a Master Item</span>
          <label class="toggle">
            <input type="checkbox" id="f-master" onchange="toggleMaster()"/>
            <div class="toggle-track"></div>
          </label>
        </div>
      </div>
      <div class="form-group" id="masters-section">
        <label>Part of Master(s)</label>
        <div id="masters-list"><span class="no-masters">No master items found</span></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn btn-save" onclick="saveItem()">Save</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    screen.orientation && screen.orientation.lock && screen.orientation.lock('portrait').catch(function(){});

    // Original data source, migrated to Supabase 2026-09-25 -- kept here for
    // reference/audit purposes only, not used by the app anymore. The Sheet
    // itself was never modified as part of the migration (only ever read via
    // this Apps Script endpoint), so it remains available as a fallback.
    // var SCRIPT_URL (Apps Script) = 'https://script.google.com/macros/s/AKfycby35cKeHOZhbmW-v1AiVceQArzPhStrfa3XG_5kfVubYWYCYv9gMPprFiM2-zrcvphm/exec';
    // var SHEET_URL = 'https://docs.google.com/spreadsheets/d/1at5qF8A5RpxlCQO84euUoPLt6FX-p8REWF-q0FkvH3I/edit?gid=0';

    var SUPABASE_URL = 'https://xrwxvrdiwvczulhlzswb.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_9DbEOHdpsPHu-XDNKRF3qA_MI3r3EWU';
    var SUPABASE_HEADERS = {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json'
    };
    // PostgREST (Supabase's REST API) caps rows per request regardless of any
    // client Range request larger than this, per the project's own server-side
    // "Max Rows" setting (confirmed via direct testing 2026-09-25: a request
    // for 20,000 rows still only returned 1,000). Paginating in code, rather
    // than relying on that dashboard setting being raised and staying raised
    // as the catalog grows, so this keeps working regardless.
    var SUPABASE_PAGE_SIZE = 1000;

    var lastCode = '';
    var lastTime = 0;
    var lastISBN = '';
    var lastItem = null;
    var currentISBN = '';
    var selectedMasters = [];
    var db = {}; // session-level opportunistic cache only, not a full preload -- see onDetected()
    var masterItems = [];
    var scannerRunning = false;
    var facingMode = 'environment';
    var inventoryData = [];
    var filteredData = [];
    var sortField = 'title';
    var sortAsc = true;
    var searchDebounceTimer = null;
    var modalSource = 'scanner';

    // ── SCANNER CONFIRMATION STATE ─────────────────────────
    var pendingCode = '';
    var pendingCount = 0;
    var REQUIRED_CONFIRMATIONS = 2;
    var MIN_CONFIDENCE = 0.75;

    // ── SUPABASE ADAPTERS ─────────────────────────────────
    // Converts a Postgres row (snake_case) to the object shape the rest of
    // this app already expects everywhere (camelCase) -- keeps every
    // rendering/sorting/modal function below completely unchanged.
    function rowFromSupabase(row) {
      return {
        isbn: row.isbn,
        sku: row.sku,
        title: row.title,
        qty: row.qty,
        looseCount: row.loose_count,
        boxes: row.boxes,
        boxCount: row.box_count,
        bookcase: row.bookcase,
        shelf: row.shelf,
        isMaster: row.is_master,
        masters: row.masters || []
      };
    }

    function rowToSupabase(item) {
      return {
        isbn: String(item.isbn),
        sku: item.sku || null,
        title: item.title,
        qty: item.qty,
        loose_count: item.looseCount,
        boxes: item.boxes,
        box_count: item.boxCount,
        // Empty string ("nothing selected/typed") is normalized to null here
        // so it matches the migrated data's convention -- the View Inventory
        // filter below relies on bookcase/shelf being genuinely null when
        // unset, not an empty string.
        bookcase: item.bookcase || null,
        shelf: (item.shelf || '').trim() || null,
        is_master: !!item.isMaster,
        masters: item.masters || []
      };
    }

    // Generic paginated GET against a Supabase table -- PostgREST caps rows
    // per request at this project's configured "Max Rows" regardless of any
    // larger Range request from the client (confirmed via direct testing
    // 2026-09-25: requesting 20,000 rows still only returned 1,000). Looping
    // with Range headers until a short page comes back handles this
    // correctly regardless of what that setting is, so it keeps working as
    // the catalog grows rather than depending on remembering to raise it.
    function supabaseFetchAll(query) {
      var results = [];
      function fetchPage(offset) {
        return fetch(SUPABASE_URL + '/rest/v1/books?' + query, {
          headers: Object.assign({}, SUPABASE_HEADERS, {
            'Range-Unit': 'items',
            'Range': offset + '-' + (offset + SUPABASE_PAGE_SIZE - 1)
          })
        })
          .then(function(r) { return r.json(); })
          .then(function(page) {
            results = results.concat(page);
            if (page.length === SUPABASE_PAGE_SIZE) return fetchPage(offset + SUPABASE_PAGE_SIZE);
            return results;
          });
      }
      return fetchPage(0);
    }

    // Strip characters that are structurally significant to PostgREST's
    // or=(...) filter grammar (grouping/quoting), rather than trying to
    // fully escape them -- customer/title lookups never need them.
    function escapeIlikeValue(v) {
      return v.replace(/[,()"\\]/g, '');
    }

    // Full-catalog search, used only once the user has typed something --
    // 2026-09-25: staff need to be able to find a book a customer is asking
    // about even if it's not currently shelved (a "suppressed" row outside
    // the View Inventory filter below), e.g. "we carried this a few years
    // ago." Runs server-side against all ~19k rows rather than the ~1,100
    // already loaded into inventoryData, capped at 200 matches.
    function searchFullCatalog(rawQuery) {
      var q = escapeIlikeValue(rawQuery.trim());
      if (!q) return Promise.resolve([]);
      var pattern = encodeURIComponent('"*' + q + '*"');
      var fields = ['isbn', 'sku', 'title', 'bookcase', 'shelf'];
      var filter = fields.map(function(f) { return f + '.ilike.' + pattern; }).join(',');
      return fetch(SUPABASE_URL + '/rest/v1/books?select=*&or=(' + filter + ')&limit=200&order=title', {
        headers: SUPABASE_HEADERS
      })
        .then(function(r) { return r.json(); })
        .then(function(rows) { return Array.isArray(rows) ? rows.map(rowFromSupabase) : []; });
    }

    // The exact "does this row belong in View Inventory" rule (2026-09-25,
    // confirmed against real examples): bookcase set, OR shelf set, OR any
    // of loose count / boxes / box count is a POSITIVE number. An explicit
    // zero count with no location stays hidden (every migrated row already
    // defaults qty to 0, so that alone can't be the trigger); a positive
    // count with no location still shows, since that likely just means the
    // location was never entered.
    var INVENTORY_VISIBILITY_FILTER =
      'or=(bookcase.not.is.null,shelf.not.is.null,loose_count.gt.0,boxes.gt.0,box_count.gt.0)';

    function fetchFilteredInventory() {
      return supabaseFetchAll('select=*&' + INVENTORY_VISIBILITY_FILTER)
        .then(function(rows) { return rows.map(rowFromSupabase); });
    }

    // Client-side mirror of INVENTORY_VISIBILITY_FILTER, used to flag search
    // results that only turned up via searchFullCatalog() -- rows already in
    // inventoryData always satisfy this by construction, so it only ever
    // marks the merged-in "suppressed" matches.
    function isCurrentlyStocked(item) {
      return !!(item.bookcase || (item.shelf && String(item.shelf).trim()) ||
        Number(item.looseCount) > 0 || Number(item.boxes) > 0 || Number(item.boxCount) > 0);
    }

    function loadMasterItems() {
      return fetch(SUPABASE_URL + '/rest/v1/books?select=isbn,title&is_master=eq.true', { headers: SUPABASE_HEADERS })
        .then(function(r) { return r.json(); })
        .then(function(rows) {
          masterItems = rows.map(function(r) { return { isbn: String(r.isbn), title: r.title }; });
        });
    }

    // Live per-ISBN lookup -- with a real database this is fast enough to
    // call directly on every scan instead of needing the whole ~19,000-book
    // catalog preloaded into memory first (which is almost certainly why the
    // old Apps Script version was slow/unreliable to even open).
    function lookupBookByIsbn(isbn) {
      return fetch(SUPABASE_URL + '/rest/v1/books?select=*&isbn=eq.' + encodeURIComponent(isbn), { headers: SUPABASE_HEADERS })
        .then(function(r) { return r.json(); })
        .then(function(rows) { return rows.length > 0 ? rowFromSupabase(rows[0]) : null; });
    }

    function saveBookToSupabase(item) {
      return fetch(SUPABASE_URL + '/rest/v1/books', {
        method: 'POST',
        headers: Object.assign({}, SUPABASE_HEADERS, { 'Prefer': 'resolution=merge-duplicates' }),
        body: JSON.stringify(rowToSupabase(item))
      }).then(function(r) {
        if (!r.ok) return r.text().then(function(t) { throw new Error(t); });
        return true;
      });
    }

    function setCacheStatus(msg) {
      var el = document.getElementById('cache-status');
      if (el) el.textContent = msg;
    }

    // ── STARTUP ───────────────────────────────────────────
    // No more full-catalog preload -- just confirm Supabase is reachable and
    // pull the (small) master-items list for the "Part of Master(s)" picker.
    loadMasterItems()
      .then(function() {
        // Objective proof a reload actually happened (e.g. after a pull-to-
        // refresh) -- the time only changes if the page truly reloaded,
        // independent of whether the pull-refresh spinner was visible.
        var t = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
        setCacheStatus('✓ Ready · updated ' + t);
      })
      .catch(function() { setCacheStatus('⚠ Offline — scan may not work'); });

    if (window.location.hash === '#inventory') {
      document.getElementById('scanner-view').classList.remove('active');
      document.getElementById('inventory-view').classList.add('active');
      loadInventory();
    }

    // ── VIEW SWITCHING ────────────────────────────────────
    function showInventory() {
      stopScanner();
      window.location.hash = 'inventory';
      document.getElementById('scanner-view').classList.remove('active');
      document.getElementById('inventory-view').classList.add('active');
      loadInventory();
    }

    function showScanner() {
      window.location.hash = '';
      document.getElementById('inventory-view').classList.remove('active');
      document.getElementById('scanner-view').classList.add('active');
    }

    // ── INVENTORY ─────────────────────────────────────────
    function loadInventory() {
      document.getElementById('inv-list').innerHTML = '<div id="inv-loading">Loading inventory...</div>';
      fetchFilteredInventory()
        .then(function(rows) {
          inventoryData = rows;
          rows.forEach(function(item) { db[String(item.isbn)] = item; });
          filteredData = inventoryData.slice();
          renderInventory();
        })
        .catch(function() {
          document.getElementById('inv-list').innerHTML = '<div class="inv-empty">Could not load inventory.</div>';
        });
    }

    function sortInventory(field) {
      if (sortField === field) { sortAsc = !sortAsc; } else { sortField = field; sortAsc = true; }
      document.querySelectorAll('.sort-btn').forEach(function(b) { b.classList.remove('active'); });
      event.target.classList.add('active');
      applySort();
      renderInventory();
    }

    function applySort() {
      filteredData.sort(function(a, b) {
        var va, vb;
        if (sortField === 'qty') {
          va = Number(a.qty) || 0; vb = Number(b.qty) || 0;
        } else if (sortField === 'shelf') {
          va = (String(a.bookcase || '') + String(a.shelf || '')).toLowerCase();
          vb = (String(b.bookcase || '') + String(b.shelf || '')).toLowerCase();
        } else {
          va = String(a[sortField] || '').toLowerCase();
          vb = String(b[sortField] || '').toLowerCase();
        }
        if (va < vb) return sortAsc ? -1 : 1;
        if (va > vb) return sortAsc ? 1 : -1;
        return 0;
      });
    }

    function filterInventory() {
      var raw = document.getElementById('inv-search').value.trim();
      var q = raw.toLowerCase();
      clearTimeout(searchDebounceTimer);

      filteredData = q ? inventoryData.filter(function(item) {
        return [item.isbn, item.sku, item.title, item.bookcase, item.shelf, item.qty, item.masters]
          .some(function(v) { return String(v || '').toLowerCase().indexOf(q) > -1; });
      }) : inventoryData.slice();
      renderInventory();

      // After a short pause, also check the full ~19k-row catalog for
      // matches outside the currently-stocked set (e.g. a customer asking
      // about a book we carried in the past but don't have located/counted
      // right now) and merge in any not already shown.
      if (raw.length >= 3) {
        searchDebounceTimer = setTimeout(function() {
          searchFullCatalog(raw).then(function(rows) {
            var seen = {};
            filteredData.forEach(function(item) { seen[String(item.isbn)] = true; });
            var extra = rows.filter(function(item) { return !seen[String(item.isbn)]; });
            if (extra.length > 0) {
              extra.forEach(function(item) { db[String(item.isbn)] = item; });
              filteredData = filteredData.concat(extra);
              renderInventory();
            }
          }).catch(function() { /* local matches already shown; fail silently */ });
        }, 400);
      }
    }

    function renderInventory() {
      applySort();
      var list = document.getElementById('inv-list');
      document.getElementById('inv-count').textContent = filteredData.length + ' items';
      if (filteredData.length === 0) { list.innerHTML = '<div class="inv-empty">No items found.</div>'; return; }
      var html = '';
      for (var i = 0; i < filteredData.length; i++) {
        var item = filteredData[i];
        var qty = Number(item.qty) || 0;
        var qtyClass = qty === 0 ? 'zero' : qty <= 3 ? 'low' : '';
        var isMaster = item.isMaster === true || item.isMaster === 'true' || item.isMaster === 'TRUE';
        var location = [item.bookcase, item.shelf].filter(Boolean).join(' · ') || '—';
        var tags = '';
        if (!isCurrentlyStocked(item)) tags += '<span class="inv-tag not-stocked">Not currently in stock</span>';
        if (isMaster) tags += '<span class="inv-tag master-badge">⭐ Master</span>';
        if (!isMaster && item.masters && item.masters.length > 0) {
          for (var j = 0; j < item.masters.length; j++) {
            var mIsbn = item.masters[j];
            var mTitle = getMasterTitle(mIsbn);
            tags += '<span class="inv-tag master-link" onclick="jumpToMaster(\'' + esc(mIsbn) + '\',event)">→ ' + esc(mTitle) + '</span>';
          }
        }
        html += '<div class="inv-row' + (isMaster ? ' is-master' : '') + '" id="inv-row-' + esc(item.isbn) + '" onclick="openModalFromInventory(\'' + esc(item.isbn) + '\')">'
          + '<div class="inv-row-top"><div class="inv-title">' + esc(item.title || '—') + '</div><div class="inv-qty ' + qtyClass + '">' + qty + '</div></div>'
          + '<div class="inv-meta">' + esc(String(item.isbn)) + ' · ' + esc(location) + '</div>'
          + (tags ? '<div class="inv-tags">' + tags + '</div>' : '')
          + '</div>';
      }
      list.innerHTML = html;
    }

    function getMasterTitle(isbn) {
      var item = db[String(isbn)];
      if (item) return item.title || isbn;
      for (var j = 0; j < masterItems.length; j++) {
        if (String(masterItems[j].isbn) === String(isbn)) return masterItems[j].title || isbn;
      }
      return isbn;
    }

    function jumpToMaster(isbn, event) {
      event.stopPropagation();
      clearTimeout(searchDebounceTimer);
      document.getElementById('inv-search').value = '';
      filteredData = inventoryData.slice();
      renderInventory();
      setTimeout(function() {
        var el = document.getElementById('inv-row-' + isbn);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          el.style.outline = '3px solid var(--orange)';
          setTimeout(function() { el.style.outline = ''; }, 2000);
        }
      }, 100);
    }

    function openModalFromInventory(isbn) {
      modalSource = 'inventory';
      var item = db[String(isbn)] || null;
      openModal(isbn, item);
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    // ── SCANNER ───────────────────────────────────────────
    function startScanner() {
      document.getElementById('scan-btn-area').style.display = 'none';
      document.getElementById('scanner-container').style.display = 'block';
      document.getElementById('stop-btn').style.display = 'block';
      document.getElementById('flip-btn').style.display = 'block';
      document.getElementById('result-hint').textContent = 'Point camera at a barcode';
      scannerRunning = false;
      pendingCode = '';
      pendingCount = 0;
      Quagga.init({
        inputStream: {
          name: 'Live', type: 'LiveStream',
          target: document.getElementById('scanner-container'),
          constraints: { facingMode: facingMode, width: { min: 640, ideal: 1280, max: 1920 }, height: { min: 480, ideal: 720, max: 1080 } },
          area: { top: '20%', right: '10%', left: '10%', bottom: '20%' }
        },
        locator: { patchSize: 'medium', halfSample: false },
        numOfWorkers: 2,
        frequency: 10,
        decoder: { readers: ['ean_reader'], debug: { drawBoundingBox: true, showFrequency: false, drawScanline: true, showPattern: false } },
        locate: true
      }, function(err) {
        if (err) { stopScanner(); return; }
        scannerRunning = true;
        Quagga.start();
      });
      Quagga.onDetected(function(result) {
        var code = result.codeResult.code;
        var decodedCodes = result.codeResult.decodedCodes.filter(function(c) { return c.error !== undefined; });
        var confidence = decodedCodes.length > 0
          ? decodedCodes.reduce(function(sum, c) { return sum + (1 - c.error); }, 0) / decodedCodes.length
          : 0;
        if (!code || !/^97\d{11}$/.test(code)) return;
        if (confidence < MIN_CONFIDENCE) return;
        if (code === pendingCode) {
          pendingCount++;
        } else {
          pendingCode = code;
          pendingCount = 1;
        }
        if (pendingCount >= REQUIRED_CONFIRMATIONS) {
          pendingCode = '';
          pendingCount = 0;
          onDetected(code);
        }
      });
    }

    function stopScanner() {
      if (scannerRunning) {
        Quagga.stop();
        var video = document.getElementById('video');
        if (video && video.srcObject) {
          video.srcObject.getTracks().forEach(function(track) { track.stop(); });
          video.srcObject = null;
        }
      }
      scannerRunning = false;
      pendingCode = '';
      pendingCount = 0;
      document.getElementById('scanner-container').style.display = 'none';
      document.getElementById('stop-btn').style.display = 'none';
      document.getElementById('flip-btn').style.display = 'none';
      document.getElementById('scan-btn-area').style.display = 'flex';
    }

    function beep() {
      try {
        var ac = new (window.AudioContext || window.webkitAudioContext)();
        var osc = ac.createOscillator();
        var gain = ac.createGain();
        osc.connect(gain); gain.connect(ac.destination);
        osc.frequency.value = 1800; gain.gain.value = 0.3;
        osc.start(); osc.stop(ac.currentTime + 0.15);
      } catch(e) {}
    }

    function onDetected(code) {
      var now = Date.now();
      if (code === lastCode && now - lastTime < 5000) return;
      lastCode = code; lastTime = now;
      beep();
      stopScanner();
      modalSource = 'scanner';
      lastISBN = code;
      document.getElementById('result-code').textContent = code;

      // Session-level opportunistic cache only (populated by View Inventory
      // and by earlier lookups this session) -- not a preloaded full catalog.
      // A hit here just saves a redundant network round-trip for re-scanning
      // something already seen; a miss falls through to a live lookup, which
      // is fast enough on a real database not to need preloading ~19,000
      // rows up front the way the old Apps Script version did.
      var cached = db[String(code)];
      if (cached) {
        lastItem = cached;
        document.getElementById('result-hint').textContent = 'Book found — tap to edit';
        openModal(code, cached);
        return;
      }

      lastItem = null;
      document.getElementById('result-hint').textContent = 'Looking up...';
      lookupBookByIsbn(code)
        .then(function(item) {
          if (item) db[String(code)] = item;
          lastItem = item;
          document.getElementById('result-hint').textContent = item ? 'Book found — tap to edit' : 'New book — tap to add';
          openModal(code, item);
        })
        .catch(function() { openModal(code, null); });
    }

    function openLastScanned() {
      if (!lastISBN) return;
      modalSource = 'scanner';
      openModal(lastISBN, lastItem);
    }

    // ── MODAL ─────────────────────────────────────────────
    function openModal(isbn, item) {
      currentISBN = isbn;
      selectedMasters = [];
      var isNew = !item;
      document.getElementById('f-isbn').value = isbn;
      document.getElementById('f-sku').value = item ? (item.sku || isbn) : isbn;
      document.getElementById('f-title').value = item ? (item.title || '') : '';
      document.getElementById('f-qty').value = item ? (item.qty || 0) : 0;
      document.getElementById('f-loose').value = item ? (item.looseCount || '') : '';
      document.getElementById('f-boxes').value = item ? (item.boxes || '') : '';
      document.getElementById('f-boxcount').value = item ? (item.boxCount || '') : '';
      document.getElementById('f-bookcase').value = item ? (item.bookcase || '') : '';
      document.getElementById('f-shelf').value = item ? (item.shelf || '') : '';
      document.getElementById('f-master').checked = item ? (item.isMaster === true || item.isMaster === 'true' || item.isMaster === 'TRUE') : false;
      if (item && item.masters) selectedMasters = Array.isArray(item.masters) ? item.masters.slice() : [];
      var badge = document.getElementById('modal-badge');
      badge.textContent = isNew ? 'NEW' : 'EXISTS';
      badge.className = isNew ? 'new' : 'existing';
      toggleMaster();
      renderMastersList();
      document.getElementById('modal-overlay').classList.add('show');
      setTimeout(function() { var t = document.getElementById('f-title'); t.focus(); t.setSelectionRange(0, 0); t.scrollLeft = 0; }, 300);   
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('show');
      currentISBN = ''; selectedMasters = [];
    }

    function toggleMaster() {
      document.getElementById('masters-section').style.display = document.getElementById('f-master').checked ? 'none' : 'block';
    }

    function renderMastersList() {
      var list = document.getElementById('masters-list');
      if (masterItems.length === 0) { list.innerHTML = '<span class="no-masters">No master items defined yet</span>'; return; }
      list.innerHTML = masterItems.map(function(m) {
        var sel = selectedMasters.indexOf(m.isbn) > -1;
        return '<div class="master-tag ' + (sel ? 'selected' : '') + '" onclick="toggleMasterTag(\'' + esc(m.isbn) + '\')">' + (sel ? '✓ ' : '') + esc(m.title) + '</div>';
      }).join('');
    }

    function toggleMasterTag(isbn) {
      var idx = selectedMasters.indexOf(isbn);
      if (idx > -1) { selectedMasters.splice(idx, 1); } else { selectedMasters.push(isbn); }
      renderMastersList();
    }

    function adjustLoose(delta) {
      var input = document.getElementById('f-loose');
      input.value = Math.max(0, (parseInt(input.value) || 0) + delta);
      onLooseChange();
      var btns = document.querySelectorAll('.qty-btn');
      btns.forEach(function(b) { b.style.pointerEvents = 'none'; });
      setTimeout(function() { btns.forEach(function(b) { b.style.pointerEvents = ''; }); }, 300);
    }

    function onQtyDirectChange() {}

    function onLooseChange() {
      var loose = parseInt(document.getElementById('f-loose').value) || 0;
      var boxes = parseInt(document.getElementById('f-boxes').value) || 0;
      var boxCount = parseInt(document.getElementById('f-boxcount').value) || 0;
      document.getElementById('f-qty').value = loose + (boxes * boxCount);
    }

    function onBoxFieldChange() {
      var loose = parseInt(document.getElementById('f-loose').value) || 0;
      var boxes = parseInt(document.getElementById('f-boxes').value) || 0;
      var boxCount = parseInt(document.getElementById('f-boxcount').value) || 0;
      document.getElementById('f-qty').value = loose + (boxes * boxCount);
    }

    function saveItem() {
      var isbn = document.getElementById('f-isbn').value.trim();
      var title = document.getElementById('f-title').value.trim();
      if (!title) { showToast('Title is required', 'error'); return; }

      var item = {
        isbn: isbn,
        sku: document.getElementById('f-sku').value.trim() || isbn,
        title: title,
        qty: parseInt(document.getElementById('f-qty').value) || 0,
        looseCount: parseInt(document.getElementById('f-loose').value) || 0,
        boxes: parseInt(document.getElementById('f-boxes').value) || 0,
        boxCount: parseInt(document.getElementById('f-boxcount').value) || 0,
        bookcase: document.getElementById('f-bookcase').value,
        shelf: document.getElementById('f-shelf').value.trim(),
        isMaster: document.getElementById('f-master').checked,
        masters: selectedMasters.slice()
      };

      db[String(isbn)] = item;
      lastItem = item;

      if (item.isMaster) {
        var exists = masterItems.some(function(m) { return m.isbn === isbn; });
        if (!exists) masterItems.push({ isbn: isbn, title: item.title });
      } else {
        masterItems = masterItems.filter(function(m) { return m.isbn !== isbn; });
      }

      var found = false;
      for (var i = 0; i < inventoryData.length; i++) {
        if (String(inventoryData[i].isbn) === String(isbn)) { inventoryData[i] = item; found = true; break; }
      }
      if (!found) inventoryData.push(item);

      showToast('Saving...', '');

      saveBookToSupabase(item)
        .then(function() { showToast('Saved!', 'success'); })
        .catch(function() { showToast('Save failed', 'error'); });

      closeModal();
    }

    // ── TOAST ─────────────────────────────────────────────
    var toastTimer;
    function showToast(msg, type) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'show' + (type ? ' ' + type : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { el.className = ''; }, 2500);
    }

    function flipCamera() {
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      stopScanner();
      startScanner();
    }

    function submitManualISBN() {
      var val = document.getElementById('manual-isbn').value.trim();
      if (!val) { showToast('Enter an ISBN first', 'error'); return; }
      if (!/^97\d{11}$/.test(val)) { showToast('ISBN must be 13 digits starting with 97', 'error'); return; }
      document.getElementById('manual-isbn').value = '';
      onDetected(val);
    }

    // ── PULL TO REFRESH ─────────────────────────────────────
    (function() {
      var indicator = document.getElementById('pull-refresh');
      var icon = document.getElementById('pr-icon');
      var text = document.getElementById('pr-text');
      var THRESHOLD = 70;
      var MAX_PULL = 100;
      var startY = 0, lastDist = 0, pulling = false, refreshing = false;

      function atTop() {
        return (window.scrollY || document.documentElement.scrollTop || document.body.scrollTop) <= 0;
      }

      function blocked() {
        // Don't hijack the gesture during an active scan or while the edit
        // modal is open (a stray reload here would silently drop unsaved edits).
        return refreshing || scannerRunning || document.getElementById('modal-overlay').classList.contains('show');
      }

      document.addEventListener('touchstart', function(e) {
        if (blocked() || !atTop()) { pulling = false; return; }
        startY = e.touches[0].clientY;
        pulling = true;
        indicator.classList.add('dragging');
      }, { passive: true });

      document.addEventListener('touchmove', function(e) {
        if (!pulling || blocked()) return;
        var dy = e.touches[0].clientY - startY;
        if (dy <= 0 || !atTop()) {
          pulling = false;
          indicator.classList.remove('dragging');
          indicator.style.transform = 'translateY(-60px)';
          return;
        }
        lastDist = Math.min(dy * 0.5, MAX_PULL);
        indicator.style.transform = 'translateY(' + (lastDist - 60) + 'px)';
        var past = lastDist >= THRESHOLD;
        icon.textContent = past ? '↑' : '↓';
        text.textContent = past ? 'Release to refresh' : 'Pull to refresh';
      }, { passive: true });

      document.addEventListener('touchend', function() {
        if (!pulling) return;
        pulling = false;
        indicator.classList.remove('dragging');
        if (lastDist >= THRESHOLD && !refreshing) {
          refreshing = true;
          indicator.style.transform = 'translateY(0)';
          icon.textContent = '⟳';
          icon.classList.add('spin');
          text.textContent = 'Refreshing...';
          setTimeout(function() { location.reload(); }, 250);
        } else {
          indicator.style.transform = 'translateY(-60px)';
        }
        lastDist = 0;
      });
    })();
  </script>
</body>
</html>
